openapi: 3.1.0
info:
  title: Growpath API
  version: 1.0.0
  description: Kontrak API 15 endpoint MVP Growpath. Auth dan health adalah endpoint pendukung. B2G, admin, mentor, billing, dan notification tidak termasuk MVP P13.
  contact:
    name: Tim Growpath
    email: halo@growpath.id
  license:
    name: Proprietary
servers:
- url: https://api.growpath.id/v1
  description: Produksi
- url: https://staging-api.growpath.id/v1
  description: Staging
security:
- bearerAuth: []
tags:
- name: Auth
- name: Profile
- name: Assessment
- name: Scoring
- name: Roadmap
- name: Progress
- name: System
- name: Consultation
paths:
  /auth/login:
    post:
      tags:
      - Auth
      summary: Login
      description: Menukar email dan password dengan access token dan refresh token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400': &id004
          description: Request tidak valid
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401': &id001
          description: Token tidak ada atau kedaluwarsa
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403': &id003
          description: Peran tidak berwenang
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429': &id007
          description: Rate limit terlampaui
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500': &id002
          description: Kesalahan internal
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /auth/me:
    get:
      tags:
      - Auth
      summary: Profil akun aktif
      description: Mengembalikan identitas, peran, dan tenant dari token.
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401': *id001
        '500': *id002
  /health:
    get:
      tags:
      - System
      summary: Health check
      description: Status API dan dependensi utama.
      security: []
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /me/profile:
    get:
      tags:
      - Profile
      summary: Baca profil UMKM
      description: Mengembalikan profil milik pengguna aktif.
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UMKMProfile'
        '401': *id001
        '403': *id003
        '404': &id005
          description: Sumber daya tidak ditemukan
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500': *id002
    put:
      tags:
      - Profile
      summary: Ganti profil UMKM
      description: Mengganti seluruh field profil. Perubahan menghitung ulang completeness_pct.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileRequest'
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UMKMProfile'
        '400': *id004
        '401': *id001
        '403': *id003
        '404': *id005
        '422': &id006
          description: Validasi gagal
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500': *id002
    patch:
      tags:
      - Profile
      summary: Perbarui sebagian profil
      description: Memperbarui field yang dikirim saja.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileRequest'
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UMKMProfile'
        '400': *id004
        '401': *id001
        '403': *id003
        '404': *id005
        '422': *id006
        '500': *id002
  /me/dashboard:
    get:
      tags:
      - Profile
      - Progress
      summary: Ringkasan dashboard UMKM
      description: Mengembalikan skor terakhir, segmen, progres roadmap, dan milestone berikutnya.
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UMKMDashboard'
        '401': *id001
        '403': *id003
        '500': *id002
  /assessments:
    post:
      tags:
      - Assessment
      summary: Buat asesmen
      description: Membuat draft asesmen untuk profil pengguna. Mengembalikan 31 kriteria aktif.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssessmentCreateRequest'
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentDraft'
        '400': *id004
        '401': *id001
        '403': *id003
        '409': &id008
          description: Konflik status atau data duplikat
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422': *id006
        '429': *id007
        '500': *id002
  /assessments/{assessment_id}:
    get:
      tags:
      - Assessment
      summary: Detail asesmen
      description: Mengembalikan status, jawaban, dan skor bila sudah dinilai.
      parameters:
      - name: assessment_id
        in: path
        required: true
        description: ID asesmen
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentDetail'
        '401': *id001
        '403': *id003
        '404': *id005
        '500': *id002
  /assessments/{assessment_id}/answers:
    put:
      tags:
      - Assessment
      summary: Simpan jawaban
      description: Batch upsert jawaban 31 kriteria. Validasi tipe dan rentang per kriteria.
      parameters:
      - name: assessment_id
        in: path
        required: true
        description: ID asesmen
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnswersRequest'
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentDraft'
        '400': *id004
        '401': *id001
        '403': *id003
        '404': *id005
        '409': *id008
        '422': *id006
        '500': *id002
  /assessments/{assessment_id}/submit:
    post:
      tags:
      - Assessment
      summary: Kirim asesmen
      description: Mengunci jawaban dan memicu scoring. Mengembalikan 202 dengan job_id.
      parameters:
      - name: assessment_id
        in: path
        required: true
        description: ID asesmen
        schema:
          type: string
          format: uuid
      responses:
        '202':
          description: Diterima untuk diproses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAccepted'
        '400': *id004
        '401': *id001
        '403': *id003
        '404': *id005
        '409': *id008
        '422': *id006
        '500': *id002
  /assessments/{assessment_id}/scores:
    get:
      tags:
      - Scoring
      summary: Baca skor
      description: Mengembalikan skor total, segmen, dan enam skor dimensi.
      parameters:
      - name: assessment_id
        in: path
        required: true
        description: ID asesmen
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScoreResult'
        '401': *id001
        '403': *id003
        '404': *id005
        '500': *id002
  /assessments/{assessment_id}/roadmap:
    get:
      tags:
      - Roadmap
      summary: Baca roadmap aktif
      description: Mengembalikan roadmap aktif beserta milestone.
      parameters:
      - name: assessment_id
        in: path
        required: true
        description: ID asesmen
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Roadmap'
        '401': *id001
        '403': *id003
        '404': *id005
        '500': *id002
  /milestones/{milestone_id}:
    patch:
      tags:
      - Progress
      summary: Perbarui status milestone
      description: Mengubah status milestone. Hanya pemilik atau admin.
      parameters:
      - name: milestone_id
        in: path
        required: true
        description: ID milestone
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MilestoneUpdateRequest'
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Milestone'
        '400': *id004
        '401': *id001
        '403': *id003
        '404': *id005
        '422': *id006
        '500': *id002
  /consultations:
    post:
      tags:
      - Consultation
      summary: Kirim pertanyaan konsultasi
      description: Membuat konsultasi, memanggil layanan AI dari backend, menyimpan jawaban dan log.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsultationRequest'
      responses:
        '201':
          description: Jawaban konsultasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Consultation'
        '409':
          description: Asesmen belum dinilai
          content: &id009
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Pertanyaan tidak valid
          content: *id009
        '429':
          description: Kuota habis
          content: *id009
        '502':
          description: Model gagal, pertanyaan tetap tersimpan
          content: *id009
    get:
      tags:
      - Consultation
      summary: Daftar konsultasi pengguna
      parameters:
      - name: from
        in: query
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        schema:
          type: string
          format: date-time
      - name: dimension
        in: query
        schema:
          type: string
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 20
      responses:
        '200':
          description: Daftar konsultasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsultationList'
  /consultations/{consultation_id}:
    get:
      tags:
      - Consultation
      summary: Detail konsultasi
      parameters:
      - name: consultation_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Detail konsultasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Consultation'
        '403':
          description: Bukan milik pengguna
          content: *id009
        '404':
          description: Tidak ditemukan
          content: *id009
  /consultations/{consultation_id}/feedback:
    post:
      tags:
      - Consultation
      summary: Umpan balik jawaban
      parameters:
      - name: consultation_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackRequest'
      responses:
        '200':
          description: Status umpan balik
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Consultation'
        '409':
          description: Belum ada jawaban
          content: *id009
        '422':
          description: Nilai tidak valid
          content: *id009
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token Supabase Auth dengan klaim sub, tenant_id, dan role.
  schemas:
    Problem:
      type: object
      properties:
        type:
          type: string
          description: URI tipe masalah
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          description: Kode error internal, misalnya AUTH_INVALID_CREDENTIALS
        trace_id:
          type: string
          format: uuid
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
      required:
      - type
      - title
      - status
      - code
      description: RFC 9457 Problem Details
    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 128
        full_name:
          type: string
          minLength: 1
          maxLength: 120
        phone:
          type: string
          maxLength: 20
        tenant_slug:
          type: string
          maxLength: 80
      required:
      - email
      - password
      - full_name
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required:
      - email
      - password
    RefreshRequest:
      type: object
      properties:
        refresh_token:
          type: string
      required:
      - refresh_token
    AuthResponse:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          const: Bearer
        expires_in:
          type: integer
          minimum: 1
        user:
          $ref: '#/components/schemas/User'
      required:
      - access_token
      - refresh_token
      - token_type
      - expires_in
      - user
    Tenant:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        type:
          type: string
          enum:
          - platform
          - institution
          - partner
        status:
          type: string
          enum:
          - active
          - suspended
          - inactive
        plan_id:
          type:
          - integer
          - 'null'
      required:
      - id
      - name
      - slug
      - type
      - status
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        full_name:
          type: string
        phone:
          type:
          - string
          - 'null'
        role:
          type: string
          enum:
          - umkm
          - pendamping
          - mentor
          - admin_b2g
          - admin_platform
        status:
          type: string
          enum:
          - active
          - invited
          - suspended
          - deleted
        last_login_at:
          type:
          - string
          - 'null'
          format: date-time
      required:
      - id
      - tenant_id
      - email
      - full_name
      - role
      - status
    UMKMProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        business_name:
          type: string
        owner_name:
          type: string
        sector:
          type: string
          enum:
          - kuliner
          - fashion
          - lainnya
        city:
          type: string
        province:
          type: string
        established_year:
          type: integer
          minimum: 1900
          maximum: 2100
        operation_months:
          type: integer
          minimum: 0
        monthly_revenue_band:
          type:
          - string
          - 'null'
          enum:
          - <1jt
          - 1-5jt
          - 5-25jt
          - '>25jt'
          - null
        employees_count:
          type:
          - integer
          - 'null'
          minimum: 0
        business_description:
          type:
          - string
          - 'null'
        completeness_pct:
          type: number
          minimum: 0
          maximum: 100
      required:
      - id
      - user_id
      - tenant_id
      - business_name
      - owner_name
      - sector
      - city
      - province
    ProfileRequest:
      type: object
      properties:
        business_name:
          type: string
          maxLength: 160
        owner_name:
          type: string
          maxLength: 120
        sector:
          type: string
          enum:
          - kuliner
          - fashion
          - lainnya
        city:
          type: string
          maxLength: 80
        province:
          type: string
          maxLength: 80
        established_year:
          type: integer
          minimum: 1900
          maximum: 2100
        operation_months:
          type: integer
          minimum: 0
        monthly_revenue_band:
          type: string
          enum:
          - <1jt
          - 1-5jt
          - 5-25jt
          - '>25jt'
        employees_count:
          type: integer
          minimum: 0
        business_description:
          type: string
      required:
      - business_name
      - owner_name
      - sector
      - city
      - province
      - established_year
      - operation_months
    UMKMDashboard:
      type: object
      properties:
        latest_assessment:
          type:
          - object
          - 'null'
          properties:
            id:
              type: string
              format: uuid
            total_score:
              type: number
            segment:
              type: string
            scored_at:
              type: string
              format: date-time
        roadmap:
          type:
          - object
          - 'null'
          properties:
            id:
              type: string
              format: uuid
            status:
              type: string
            completed_milestones:
              type: integer
            total_milestones:
              type: integer
        next_milestone:
          type:
          - object
          - 'null'
          properties:
            id:
              type: string
              format: uuid
            title:
              type: string
            due_date:
              type: string
              format: date
    AssessmentCreateRequest:
      type: object
      properties:
        profile_id:
          type: string
          format: uuid
    Assessment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        umkm_profile_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - draft
          - submitted
          - scored
          - archived
        scoring_version:
          type: string
        total_score:
          type:
          - number
          - 'null'
        segment_id:
          type:
          - integer
          - 'null'
        submitted_at:
          type:
          - string
          - 'null'
          format: date-time
        scored_at:
          type:
          - string
          - 'null'
          format: date-time
      required:
      - id
      - status
      - scoring_version
    AssessmentDraft:
      type: object
      properties:
        assessment:
          $ref: '#/components/schemas/Assessment'
        criteria:
          type: array
          items:
            $ref: '#/components/schemas/Criterion'
      required:
      - assessment
      - criteria
    AssessmentDetail:
      type: object
      properties:
        assessment:
          $ref: '#/components/schemas/Assessment'
        answers:
          type: array
          items:
            $ref: '#/components/schemas/AssessmentAnswer'
        scores:
          type: array
          items:
            $ref: '#/components/schemas/DimensionScore'
        segment:
          type:
          - object
          - 'null'
          properties:
            id:
              type: integer
            name:
              type: string
            code:
              type: string
    AssessmentAnswer:
      type: object
      properties:
        criterion_id:
          type: integer
        raw_value: {}
        numeric_value:
          type:
          - number
          - 'null'
        score:
          type:
          - number
          - 'null'
      required:
      - criterion_id
      - raw_value
    AnswersRequest:
      type: object
      properties:
        answers:
          type: array
          items:
            $ref: '#/components/schemas/AssessmentAnswer'
      required:
      - answers
    Criterion:
      type: object
      properties:
        id:
          type: integer
        dimension_id:
          type: integer
        code:
          type: string
        question:
          type: string
        input_type:
          type: string
          enum:
          - boolean
          - scale
          - enum
          - number
          - text
        weight:
          type: number
        is_active:
          type: boolean
        version:
          type: string
      required:
      - id
      - dimension_id
      - code
      - question
      - input_type
      - weight
    DimensionScore:
      type: object
      properties:
        dimension_id:
          type: integer
        raw_score:
          type:
          - number
          - 'null'
        weighted_score:
          type: number
        is_scored:
          type: boolean
    ScoreResult:
      type: object
      properties:
        assessment_id:
          type: string
          format: uuid
        total_score:
          type: number
        segment:
          $ref: '#/components/schemas/Segment'
        dimensions:
          type: array
          items:
            $ref: '#/components/schemas/DimensionScore'
      required:
      - assessment_id
      - total_score
      - segment
      - dimensions
    Segment:
      type: object
      properties:
        id:
          type: integer
        code:
          type: string
        name:
          type: string
        min_score:
          type: number
        max_score:
          type: number
      required:
      - id
      - code
      - name
      - min_score
      - max_score
    AssessmentList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Assessment'
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
      required:
      - items
      - page
      - limit
      - total
    JobAccepted:
      type: object
      properties:
        job_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - queued
          - running
        resource_id:
          type: string
          format: uuid
      required:
      - job_id
      - status
    RoadmapGenerateRequest:
      type: object
      properties:
        force:
          type: boolean
          default: false
        prompt_version:
          type: string
    Roadmap:
      type: object
      properties:
        id:
          type: string
          format: uuid
        assessment_id:
          type: string
          format: uuid
        version:
          type: integer
        status:
          type: string
          enum:
          - draft
          - active
          - completed
          - superseded
        title:
          type: string
        summary:
          type:
          - string
          - 'null'
        generated_by:
          type: string
          enum:
          - rule
          - llm
          - hybrid
          - manual
        milestones:
          type: array
          items:
            $ref: '#/components/schemas/Milestone'
      required:
      - id
